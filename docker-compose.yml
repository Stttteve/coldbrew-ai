services:
  postgres:
    image: postgres:16-alpine
    container_name: coldbrew-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coldbrew
      POSTGRES_PASSWORD: coldbrew
      POSTGRES_DB: coldbrew
    ports:
      - "5433:5432"  # host 5433 to avoid colliding with a local Postgres
    volumes:
      - coldbrew-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldbrew -d coldbrew"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: coldbrew-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"  # host 6380 to avoid colliding with a local Redis
    volumes:
      - coldbrew-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  coldbrew-pg-data:
  coldbrew-redis-data:
